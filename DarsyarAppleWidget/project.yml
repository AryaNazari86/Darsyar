name: DarsyarAppleWidget
options:
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.10
    MACOSX_DEPLOYMENT_TARGET: 14.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0

targets:
  DarsyarWidgetHost:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Darsyar Widget Host
        LSApplicationCategoryType: public.app-category.education
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.darsyar.widgethost
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
    sources:
      - path: App
    dependencies:
      - target: DarsyarUsersWidgetExtension
        embed: true

  DarsyarUsersWidgetExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).DarsyarUsersWidgetBundle"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.darsyar.widgethost.widget
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    sources:
      - path: Widget
      - path: Shared
